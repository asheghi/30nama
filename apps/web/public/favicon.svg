<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <!-- Apple-black background -->
  <rect width="32" height="32" rx="6" fill="#000"/>

  <!-- Potato body: lumpy oval, warm starchy beige -->
  <path d="M 7 17 C 6 12 9 8 13 7.5 C 16 7 20 8 22 11 C 24 14 24 19 22 22 C 20 25 15 26 11 24 C 8 22 7 20 7 17 Z"
        fill="#C8A86B"/>

  <!-- A couple of potato eye bumps for realism -->
  <ellipse cx="13" cy="14" rx="1.5" ry="1" fill="#A07840" transform="rotate(-15 13 14)"/>
  <ellipse cx="18" cy="19" rx="1.2" ry="0.8" fill="#A07840" transform="rotate(10 18 19)"/>

  <!-- The "+" — top-right, thin like Apple TV+ -->
  <text x="26" y="10"
        text-anchor="middle"
        font-family="-apple-system, BlinkMacSystemFont, Helvetica Neue, sans-serif"
        font-weight="200"
        font-size="11"
        fill="#ffffff">+</text>
</svg>
